---
# =============================================================================
# ROLE: media
# -----------------------------------------------------------------------------
# O QUE FAZ
#   Provisiona as duas stacks de mídia: Jellyfin (vídeo) e Navidrome (música).
#
#   O Picard (organização de metadados musicais) foi REMOVIDO em 12/09/2026 —
#   ver o bloco de limpeza no fim deste arquivo para o motivo.
#
# COMO OS GIDs DE VÍDEO SÃO RESOLVIDOS — o detalhe mais sutil desta role
#
#   Para transcodificar por hardware, o Jellyfin precisa acessar /dev/dri.
#   No host esses dispositivos pertencem a grupos específicos:
#       /dev/dri/renderD128  ->  grupo render  (GID 105 neste host)
#       /dev/dri/card0       ->  grupo video   (GID 39  neste host)
#
#   A tentação é escrever `group_add: [video, render]` no compose. ISSO NÃO
#   FUNCIONA: o Docker resolve nomes de grupo DENTRO do container. O Jellyfin
#   roda Debian, onde `video` é GID 44 — que não corresponde ao GID 39 do host
#   AlmaLinux. O container ganharia um grupo irrelevante e o acesso ao
#   dispositivo continuaria negado.
#
#   A solução é passar o GID NUMÉRICO do host. As tasks abaixo descobrem esses
#   números no host em tempo de execução, para que o playbook funcione mesmo
#   numa distribuição onde os GIDs sejam outros.
# =============================================================================

- name: Descobrir GID do grupo render no host
  # CORREÇÃO (B4). `getent group` consulta a base de usuários do host.
  # check_mode: false porque é leitura pura e o resultado alimenta um template.
  ansible.builtin.command: "getent group render"
  register: render_group
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [media, jellyfin]

- name: Descobrir GID do grupo video no host
  ansible.builtin.command: "getent group video"
  register: video_group
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [media, jellyfin]

# BUG REAL, encontrado testando num host verdadeiramente limpo:
#
#   A decisão de mapear /dev/dri no compose olhava só se o GRUPO render/video
#   existe. Mas grupo não é dispositivo: uma VM KVM sem GPU MESMO ASSIM tem
#   os grupos render (105) e video (39) — o systemd os cria por padrão. O
#   resultado era o container do Jellyfin falhar no start com
#   "error gathering device information ... /dev/dri/renderD128: no such
#   file or directory".
#
#   `stat` é módulo de leitura e roda em --check (ao contrário de um
#   `command: test -e`), então não precisa de check_mode: false.
- name: Verificar se o dispositivo de render (VAAPI) existe
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: dev_renderd128
  tags: [media, jellyfin]

- name: Verificar se o dispositivo de vídeo (card0) existe
  ansible.builtin.stat:
    path: /dev/dri/card0
  register: dev_card0
  tags: [media, jellyfin]

- name: Registrar GIDs de vídeo para uso no compose
  # `getent group render` devolve algo como "render:x:105:": split por ":" e
  # terceiro campo (índice 2) = o GID.
  #
  # O GID só é registrado quando o grupo existe E o dispositivo correspondente
  # existe no host. Sem o dispositivo, o fact fica vazio, o compose não mapeia
  # o device nem adiciona o grupo, e o Jellyfin cai para transcodificação por
  # CPU — em vez de nem subir.
  ansible.builtin.set_fact:
    jellyfin_render_gid: >-
      {{ (render_group.stdout | default('')).split(':')[2] | default('', true)
         if dev_renderd128.stat.exists | default(false) else '' }}
    jellyfin_video_gid: >-
      {{ (video_group.stdout | default('')).split(':')[2] | default('', true)
         if dev_card0.stat.exists | default(false) else '' }}
  tags: [media, jellyfin]

- name: Mostrar GIDs detectados
  ansible.builtin.debug:
    msg: >-
      GIDs de vídeo neste host — render: {{ jellyfin_render_gid | default('ausente') }},
      video: {{ jellyfin_video_gid | default('ausente') }}.
      {{ 'Transcodificação por hardware disponível.'
         if jellyfin_render_gid else
         'Sem GPU utilizável (grupo ou /dev/dri ausente): o Jellyfin usará
          transcodificação por software (CPU).' }}
  tags: [media, jellyfin]

- name: Diretórios das stacks de mídia
  ansible.builtin.file:
    path: "{{ app_home }}/docker/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0750'
  loop: [jellyfin, navidrome]
  tags: [media]

- name: Diretórios de dados persistentes
  # Estes diretórios guardam o ESTADO das aplicações: banco do Jellyfin e
  # biblioteca indexada do Navidrome. Se sumirem, você perde histórico de
  # reprodução e usuários.
  #
  # Ficam no host (bind mount), não em volumes Docker nomeados, para que um
  # `docker compose down -v` acidental não os destrua.
  ansible.builtin.file:
    path: "{{ app_home }}/docker/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0750'
  loop:
    - jellyfin/config
    - jellyfin/cache
    - navidrome/data
  tags: [media]

- name: Compose files das stacks de mídia
  ansible.builtin.template:
    src: "{{ item }}-compose.yml.j2"
    dest: "{{ app_home }}/docker/{{ item }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0640'
  loop: [jellyfin, navidrome]
  tags: [media]

- name: Remover diretório órfão ~/jellyfin
  # Sobra de uma tentativa anterior, de antes das stacks migrarem para
  # ~/docker/. A auditoria encontrou ~/jellyfin/{cache,config} vazios e de
  # dono root, dentro do home do usuário.
  #
  # Limpeza faz parte da convergência: um repositório de IaC que só ADICIONA
  # coisas deixa um rastro de restos que ninguém sabe se pode apagar.
  ansible.builtin.file:
    path: "{{ app_home }}/jellyfin"
    state: absent
  tags: [media, cleanup]

# -----------------------------------------------------------------------------
# REMOÇÃO DO PICARD — 12/09/2026
# -----------------------------------------------------------------------------
# POR QUE FOI REMOVIDO
#
#   Medido de fora, pela internet, durante a convergência de produção:
#
#       $ curl -o /dev/null -w '%{http_code}' https://capas.<domínio>/
#       200
#
#   Enquanto jellyfin, music e painel respondiam 302 (redirect para o login do
#   Cloudflare Access), o capas respondia 200 — ou seja, chegava direto na
#   origem, SEM política de Access na frente. E o que havia na origem era a
#   interface noVNC do Picard, que a imagem entrega com WEB_AUTHENTICATION=0 e
#   VNC_PASSWORD vazio: uma sessão gráfica interativa, sem autenticação
#   nenhuma, com permissão de ESCRITA sobre a biblioteca de música inteira.
#
#   A rota já existia em cloudflare_ingress desde antes deste repositório, e o
#   bind local em 127.0.0.1 (feito nesta mesma convergência) fechou só a LAN —
#   o caminho pelo túnel continuava aberto.
#
#   O usuário decidiu remover em vez de proteger: usou o Picard uma única vez e
#   a ferramenta não faz mais parte da suíte. Remover é melhor do que proteger
#   o que não se usa — cada serviço a menos é uma superfície a menos.
#
#   LIÇÃO: o inventário de rotas do túnel precisa ser revisado junto com o
#   inventário de serviços. Um serviço que você parou de usar mas cuja rota
#   ficou para trás não some do mapa de exposição — ele só sai do seu radar.
#
# ATENÇÃO: esta task APAGA {{ app_home }}/docker/picard, inclusive o ./config
# com as preferências do Picard. Se um dia precisar recuperar algo de lá,
# recupere ANTES de rodar esta role.
- name: Remover a stack do Picard (serviço descontinuado)
  ansible.builtin.file:
    path: "{{ app_home }}/docker/picard"
    state: absent
  tags: [media, cleanup]
