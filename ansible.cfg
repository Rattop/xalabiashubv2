[defaults]
inventory              = inventory.ini
roles_path             = roles
host_key_checking      = True
retry_files_enabled    = False
# CORREÇÃO: 'stdout_callback = yaml' + bin_ansible_callbacks dependiam do
# plugin community.general.yaml, que foi REMOVIDO da collection a partir da
# versão 12.0.0 (setembro/2026). A formatação em YAML deixou de ser um
# plugin externo e virou uma opção do próprio callback padrão do
# ansible-core — é isso que a seção [callback_default] mais abaixo faz.
stdout_callback        = default
interpreter_python     = /usr/bin/python3
forks                  = 10
# Mostra a diferença exata de cada arquivo alterado. Essencial rodando
# contra um host vivo: você vê o que mudou antes de confiar.
diff                   = True

# Cabeçalho inserido por {{ ansible_managed }} no topo de cada template.
# Sem isto o padrão é só "Ansible managed", que não diz de ONDE veio.
# Com o caminho do arquivo-fonte, quem encontrar o arquivo no host em 2028
# sabe exatamente qual template no repositório o gerou.
ansible_managed        = ARQUIVO GERADO PELO ANSIBLE - nao edite no host. Fonte: {file} | Alteracoes manuais sao sobrescritas.

[callback_default]
# Substitui o antigo stdout_callback=yaml. Resultado visual equivalente
# (saída estruturada e legível), mas usando a opção nativa do callback
# padrão em vez de um plugin de collection que pode ser removido de novo
# no futuro — é o próprio ansible-core que garante compatibilidade aqui.
result_format = yaml

[privilege_escalation]
become        = False
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
